<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Apple 精選 MacBook Pro 與 iPad 全系列商品與價格">
  <title>Apple Select - MacBook Pro 與 iPad</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    :root {
      --ink: #171717;
      --muted: #74716c;
      --paper: #f4f1ec;
      --card: #fbfaf8;
      --line: #ded9d0;
      --orange: #ff6a3d;
      --orange-deep: #d84521;
      --blue: #2856c5;
      --dark: #101010;
      --shadow: 0 18px 42px rgba(32, 24, 16, .09);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: 'DM Sans', 'Noto Sans TC', sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .topbar { background: var(--dark); color: #fff; padding: 11px 5vw; text-align: center; font-size: 12px; letter-spacing: .08em; }
    .topbar strong { color: #ffb08d; font-weight: 700; }
    header { background: rgba(244, 241, 236, .93); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    nav { max-width: 1240px; height: 70px; margin: auto; padding: 0 24px; display: flex; align-items: center; gap: 38px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-size: 17px; font-weight: 900; letter-spacing: -.04em; white-space: nowrap; }
    .brand-mark { width: 29px; height: 34px; position: relative; display: inline-block; }
    .brand-mark:before { content: ''; position: absolute; inset: 4px 2px 0; background: var(--ink); border-radius: 48% 48% 43% 43% / 42% 42% 58% 58%; transform: rotate(-9deg); }
    .brand-mark:after { content: ''; position: absolute; width: 10px; height: 7px; background: var(--ink); border-radius: 100% 0; transform: rotate(-28deg); top: 0; right: 1px; }
    .navlinks { display: flex; gap: 28px; margin-left: auto; }
    .navlinks a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; }
    .navlinks a:hover { color: var(--ink); }
    .bag { border: 0; background: var(--ink); color: #fff; border-radius: 100px; padding: 10px 15px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .bag-count { width: 18px; height: 18px; border-radius: 50%; background: var(--orange); display: grid; place-items: center; font-size: 10px; }

    main { overflow: hidden; }
    .hero { max-width: 1240px; margin: auto; min-height: 520px; padding: 86px 24px 78px; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 50px; }
    .eyebrow { color: var(--orange-deep); font-size: 12px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
    h1 { font-size: clamp(50px, 6.2vw, 88px); line-height: .94; letter-spacing: -.075em; margin: 19px 0 25px; max-width: 660px; }
    .hero-copy { color: var(--muted); line-height: 1.75; max-width: 470px; font-size: 15px; }
    .hero-actions { display: flex; align-items: center; gap: 22px; margin-top: 34px; }
    .primary { border: 0; border-radius: 100px; padding: 14px 23px; background: var(--orange); color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 8px 18px rgba(255, 106, 61, .23); }
    .primary:hover { background: var(--orange-deep); }
    .text-link { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 4px; font-size: 13px; font-weight: 600; }
    .hero-art { position: relative; min-height: 360px; display: grid; place-items: center; }
    .sun { position: absolute; width: 290px; height: 290px; border-radius: 50%; background: #ffb98d; filter: saturate(.9); }
    .laptop { width: min(390px, 85%); aspect-ratio: 1.45; border: 9px solid #353535; border-bottom-width: 15px; border-radius: 15px 15px 4px 4px; background: linear-gradient(135deg, #232323, #7c7c7c 48%, #222); transform: rotate(-8deg); z-index: 1; box-shadow: 24px 28px 0 rgba(30, 25, 19, .14); position: relative; overflow: hidden; }
    .laptop:after { content: 'pro'; position: absolute; top: 45%; left: 43%; color: rgba(255,255,255,.48); font-weight: 700; font-size: 19px; letter-spacing: -.06em; }
    .laptop-screen { position: absolute; inset: 12px; border-radius: 4px; background: radial-gradient(circle at 73% 23%, #ffb978 0 4%, transparent 5%), linear-gradient(135deg, #1c1a24, #8d5d49 47%, #0f1114); }
    .tablet { width: 130px; height: 184px; background: #c1c3c7; border: 7px solid #262626; border-radius: 16px; position: absolute; right: 6%; bottom: 32px; transform: rotate(13deg); z-index: 2; box-shadow: 13px 18px 0 rgba(30, 25, 19, .13); }
    .tablet:after { content: ''; position: absolute; inset: 12px 7px; border-radius: 7px; background: linear-gradient(140deg, #d1a48f, #e9d0a6 45%, #4c6681); }

    .catalog { background: #fff; border-top: 1px solid var(--line); padding: 82px 24px 100px; }
    .catalog-inner { max-width: 1240px; margin: auto; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 32px; }
    .section-head h2 { font-size: 39px; letter-spacing: -.06em; margin: 7px 0 0; }
    .section-head p { color: var(--muted); font-size: 13px; margin: 0 0 5px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 34px; flex-wrap: wrap; }
    .filter { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 100px; padding: 10px 17px; font-size: 12px; font-weight: 600; }
    .filter.active, .filter:hover { color: #fff; background: var(--ink); border-color: var(--ink); }
    .search { margin-left: auto; border: 1px solid var(--line); border-radius: 100px; padding: 10px 16px; min-width: 190px; outline: 0; background: #faf9f7; font-size: 12px; }
    .search:focus { border-color: var(--orange); }
    .products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 17px; }
    .product { background: var(--card); min-height: 420px; padding: 19px; display: flex; flex-direction: column; border: 1px solid #eeeae4; position: relative; transition: transform .25s, box-shadow .25s; }
    .product:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
    .tag { position: absolute; top: 16px; left: 16px; border-radius: 4px; background: #e6ecff; color: var(--blue); font-size: 10px; padding: 5px 8px; font-weight: 700; }
    .product-art { height: 205px; display: grid; place-items: center; margin-bottom: 18px; }
    .device { position: relative; background: linear-gradient(135deg, #a7abb0, #3f4246); box-shadow: 10px 12px 0 rgba(30,25,19,.12); }
    .device.mac { width: 194px; height: 135px; border: 7px solid #4a4b4d; border-radius: 10px 10px 3px 3px; transform: rotate(-5deg); }
    .device.mac:after { content: ''; position: absolute; height: 7px; width: 226px; bottom: -14px; left: -22px; background: #8f9193; border-radius: 3px 3px 8px 8px; }
    .device.mac:before { content: '✦'; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.35); font-size: 27px; }
    .device.ipad { width: 119px; height: 164px; border: 7px solid #292a2c; border-radius: 13px; transform: rotate(5deg); }
    .device.ipad:after { content: ''; position: absolute; inset: 10px 6px; border-radius: 6px; background: linear-gradient(145deg, #f2b5a4, #edd28f 42%, #5b769a); }
    .product h3 { font-size: 20px; letter-spacing: -.05em; margin: 0 0 7px; }
    .spec { color: var(--muted); font-size: 12px; min-height: 35px; line-height: 1.5; }
    .price-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: auto; padding-top: 18px; }
    .price { font-size: 17px; font-weight: 700; }
    .price small { font-size: 10px; color: var(--muted); font-weight: 400; }
    .add { border: 0; border-radius: 50%; width: 34px; height: 34px; background: var(--ink); color: #fff; font-size: 21px; line-height: 1; }
    .add:hover { background: var(--orange); }
    .empty { grid-column: 1 / -1; color: var(--muted); padding: 50px; text-align: center; }
    footer { background: var(--dark); color: #fff; padding: 35px 24px; font-size: 12px; }
    .footer-inner { max-width: 1240px; margin: auto; display: flex; justify-content: space-between; gap: 20px; color: #999; }
    .footer-inner strong { color: #fff; }
    .notice { position: fixed; right: 22px; bottom: 22px; background: var(--ink); color: #fff; padding: 14px 18px; border-left: 4px solid var(--orange); transform: translateY(120px); transition: transform .3s; z-index: 20; font-size: 13px; box-shadow: var(--shadow); }
    .notice.show { transform: translateY(0); }
    /* Futuristic interface layer */
    :root {
      --ink: #e7f0f2;
      --muted: #8ca0a8;
      --paper: #071116;
      --card: #0d1b21;
      --line: #20353d;
      --orange: #49e6ff;
      --orange-deep: #15aeca;
      --blue: #b9f34b;
      --dark: #03080b;
      --shadow: 0 18px 45px rgba(0, 229, 255, .08);
    }
    body { background: var(--paper); color: var(--ink); background-image: linear-gradient(rgba(73,230,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(73,230,255,.045) 1px, transparent 1px), radial-gradient(circle at 75% 10%, rgba(0,182,211,.14), transparent 30%); background-size: 42px 42px, 42px 42px, auto; }
    .topbar { background: var(--dark); border-bottom: 1px solid #183640; color: #a9c0c7; font-size: 11px; letter-spacing: .13em; }
    .topbar strong { color: var(--blue); }
    header { background: rgba(5, 14, 18, .84); border-bottom-color: var(--line); }
    .brand { color: var(--ink); text-transform: uppercase; letter-spacing: .08em; }
    .brand-mark { width: 27px; height: 27px; border-radius: 4px; background: transparent; border: 1px solid var(--orange); transform: none; display: grid; place-items: center; }
    .brand-mark:before { content: '⌁'; position: static; background: none; color: var(--orange); transform: none; font-size: 21px; line-height: 1; }
    .brand-mark:after { display: none; }
    .navlinks a { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .navlinks a:hover { color: var(--orange); }
    .bag { border: 1px solid #2d5662; border-radius: 3px; background: rgba(13, 37, 45, .8); color: var(--ink); font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; }
    .bag:hover { border-color: var(--orange); box-shadow: 0 0 18px rgba(73,230,255,.15); }
    .bag-count { border-radius: 2px; background: var(--blue); color: var(--dark); }
    .hero { min-height: 590px; position: relative; }
    .hero:before { content: 'SYSTEM / 01'; position: absolute; top: 25px; right: 24px; color: #45616a; font: 10px 'DM Mono', monospace; letter-spacing: .16em; }
    .eyebrow { color: var(--orange); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .18em; }
    h1 { text-transform: uppercase; letter-spacing: -.08em; text-shadow: 0 0 35px rgba(73,230,255,.15); }
    h1 em { color: var(--orange); font-style: normal; }
    .hero-copy { color: var(--muted); }
    .primary { border-radius: 3px; padding: 14px 22px; background: var(--orange); color: var(--dark); box-shadow: 0 0 25px rgba(73,230,255,.2); text-transform: uppercase; letter-spacing: .04em; }
    .primary:hover { background: var(--blue); }
    .text-link { color: var(--orange); border-bottom-color: var(--orange); }
    .sun { width: 330px; height: 330px; border-radius: 50%; background: transparent; border: 1px solid rgba(73,230,255,.52); box-shadow: 0 0 0 16px rgba(73,230,255,.04), 0 0 70px rgba(73,230,255,.2); }
    .sun:after { content: ''; position: absolute; inset: 26px; border: 1px dashed rgba(185,243,75,.4); border-radius: 50%; }
    .laptop { border-color: #77909a; background: linear-gradient(135deg, #162a32, #78939c 48%, #17272d); box-shadow: 24px 28px 0 rgba(0,0,0,.22), 0 0 35px rgba(73,230,255,.15); }
    .laptop-screen { background: radial-gradient(circle at 73% 23%, var(--blue) 0 4%, transparent 5%), linear-gradient(135deg, #071a22, #0c7583 47%, #071116); }
    .laptop:after { content: 'M4 / PRO'; color: rgba(185,243,75,.7); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .12em; }
    .tablet { background: #647b84; border-color: #b0c6ca; box-shadow: 13px 18px 0 rgba(0,0,0,.24), 0 0 25px rgba(73,230,255,.15); }
    .tablet:after { background: linear-gradient(140deg, #143844, #1e9eb2 45%, #254f5a); }
    .catalog { background: rgba(3, 10, 13, .7); border-top-color: var(--line); }
    .section-head h2 { color: var(--ink); text-transform: uppercase; }
    .section-head p { color: var(--muted); }
    .filter { border-color: var(--line); background: rgba(13,27,33,.8); color: var(--muted); border-radius: 3px; font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; }
    .filter.active, .filter:hover { color: var(--dark); background: var(--orange); border-color: var(--orange); }
    .search { margin-left: auto; border-color: var(--line); border-radius: 3px; color: var(--ink); background: #09171c; font-family: 'DM Mono', monospace; }
    .search:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(73,230,255,.08); }
    .product { background: linear-gradient(145deg, rgba(15,31,38,.96), rgba(7,18,23,.96)); border-color: var(--line); box-shadow: inset 0 1px rgba(255,255,255,.03); }
    .product:hover { box-shadow: var(--shadow), inset 0 1px rgba(73,230,255,.2); }
    .tag { border-radius: 2px; background: rgba(185,243,75,.12); color: var(--blue); border: 1px solid rgba(185,243,75,.35); font-family: 'DM Mono', monospace; }
    .device { box-shadow: 10px 12px 0 rgba(0,0,0,.25), 0 0 22px rgba(73,230,255,.1); }
    .device.mac { border-color: #6d858d; }
    .device.mac:after { background: #9db0b4; }
    .device.mac:before { color: rgba(185,243,75,.6); }
    .device.ipad { border-color: #b5c8ca; }
    .device.ipad:after { background: linear-gradient(145deg, #0e5260, #22b5c2 42%, #173f58); }
    .product h3 { color: var(--ink); }
    .spec { color: var(--muted); }
    .price { color: var(--blue); font-family: 'DM Mono', monospace; font-size: 15px; }
    .price small { color: var(--muted); }
    .add { border-radius: 3px; background: var(--orange); color: var(--dark); }
    .add:hover { background: var(--blue); }
    .empty { color: var(--muted); }
    footer { background: var(--dark); color: var(--muted); border-top: 1px solid var(--line); }
    .footer-inner strong { color: var(--orange); }
    .notice { border-left-color: var(--blue); background: #0d252c; color: var(--ink); box-shadow: 0 0 25px rgba(73,230,255,.15); }
    @media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding-top: 62px; } .hero-art { min-height: 290px; } .products { grid-template-columns: repeat(2, 1fr); } .navlinks { display: none; } }
    @media (max-width: 560px) { .topbar { font-size: 10px; } nav { height: 62px; padding: 0 16px; } .hero { padding: 48px 20px 50px; } h1 { font-size: 56px; } .hero-art { min-height: 250px; } .sun { width: 210px; height: 210px; } .laptop { width: 290px; } .tablet { right: 0; width: 100px; height: 145px; } .catalog { padding: 57px 16px 70px; } .section-head { display: block; } .section-head h2 { font-size: 32px; } .section-head p { margin-top: 10px; } .search { margin-left: 0; width: 100%; } .products { grid-template-columns: 1fr; gap: 12px; } .product { min-height: 390px; } .footer-inner { display: block; line-height: 2; } }
  </style>
</head>
<body>
  <div class="topbar">免費配送，滿額再享 <strong>24 期 0 利率</strong> ｜ 台灣地區專屬選購</div>
  <header>
    <nav>
      <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"></span>apple select</a>
      <div class="navlinks"><a href="#products">所有商品</a><a href="#products" data-nav="mac">MacBook Pro</a><a href="#products" data-nav="ipad">iPad</a></div>
      <button class="bag" type="button" id="bagButton" aria-label="購物袋">購物袋 <span class="bag-count" id="bagCount">0</span></button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div>
        <div class="eyebrow">The new generation</div>
        <h1>把想法，<br><em>帶到更遠。</em></h1>
        <p class="hero-copy">MacBook Pro 的極致效能，iPad 的自由想像。挑選最適合你的 Apple 裝置，讓每個日常工作與創作，都有更漂亮的答案。</p>
        <div class="hero-actions"><a class="primary" href="#products">探索全部商品</a><a class="text-link" href="#products">查看本月精選 →</a></div>
      </div>
      <div class="hero-art" aria-label="MacBook Pro 與 iPad 展示圖"><div class="sun"></div><div class="laptop"><div class="laptop-screen"></div></div><div class="tablet"></div></div>
    </section>

    <section class="catalog" id="products">
      <div class="catalog-inner">
        <div class="section-head"><div><div class="eyebrow">Choose your next</div><h2>全系列商品</h2></div><p>價格皆為台灣建議售價，實際以結帳頁為準</p></div>
        <div class="toolbar"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="mac">MacBook Pro</button><button class="filter" data-filter="ipad">iPad</button><input class="search" id="search" type="search" placeholder="搜尋商品名稱..." aria-label="搜尋商品名稱"></div>
        <div class="products" id="productGrid"></div>
      </div>
    </section>
  </main>

  <footer><div class="footer-inner"><div><strong>apple select</strong> ｜ 讓科技，貼近你的每一天。</div><div>© 2026 Apple Select Taiwan　購物須知　隱私權政策</div></div></footer>
  <div class="notice" id="notice" role="status"></div>
  <script>
    const products = [
      { type: 'mac', name: 'MacBook Pro 14 吋', spec: 'M4 晶片｜16GB 記憶體｜512GB SSD', price: 54900, tag: '熱門推薦' },
      { type: 'mac', name: 'MacBook Pro 14 吋', spec: 'M4 Pro 晶片｜24GB 記憶體｜512GB SSD', price: 69900, tag: '專業首選' },
      { type: 'mac', name: 'MacBook Pro 14 吋', spec: 'M4 Max 晶片｜36GB 記憶體｜1TB SSD', price: 99900, tag: '極致效能' },
      { type: 'mac', name: 'MacBook Pro 16 吋', spec: 'M4 Pro 晶片｜24GB 記憶體｜512GB SSD', price: 84900, tag: '大螢幕' },
      { type: 'mac', name: 'MacBook Pro 16 吋', spec: 'M4 Max 晶片｜36GB 記憶體｜1TB SSD', price: 114900, tag: '旗艦機型' },
      { type: 'ipad', name: 'iPad Pro 11 吋', spec: 'M4 晶片｜256GB｜Wi-Fi', price: 29900, tag: '全新設計' },
      { type: 'ipad', name: 'iPad Pro 13 吋', spec: 'M4 晶片｜256GB｜Wi-Fi', price: 39900, tag: '專業創作' },
      { type: 'ipad', name: 'iPad Air 11 吋', spec: 'M3 晶片｜128GB｜Wi-Fi', price: 19900, tag: '輕巧有力' },
      { type: 'ipad', name: 'iPad Air 13 吋', spec: 'M3 晶片｜128GB｜Wi-Fi', price: 26900, tag: '大畫面' },
      { type: 'ipad', name: 'iPad (A16)', spec: 'A16 晶片｜128GB｜Wi-Fi', price: 11900, tag: '入門推薦' },
      { type: 'ipad', name: 'iPad mini', spec: 'A17 Pro 晶片｜128GB｜Wi-Fi', price: 16900, tag: '隨身創作' }
    ];
    let activeFilter = 'all';
    let bagCount = 0;
    const grid = document.getElementById('productGrid');
    const formatPrice = value => 'NT$ ' + value.toLocaleString('zh-TW');
    function render() {
      const keyword = document.getElementById('search').value.trim().toLowerCase();
      const list = products.filter(item => (activeFilter === 'all' || item.type === activeFilter) && (item.name + item.spec).toLowerCase().includes(keyword));
      grid.innerHTML = list.length ? list.map(item => `<article class="product"><span class="tag">${item.tag}</span><div class="product-art"><div class="device ${item.type === 'mac' ? 'mac' : 'ipad'}"></div></div><h3>${item.name}</h3><div class="spec">${item.spec}</div><div class="price-row"><div class="price">${formatPrice(item.price)}<small> 起</small></div><button class="add" type="button" aria-label="加入 ${item.name}" data-name="${item.name}">＋</button></div></article>`).join('') : '<div class="empty">找不到符合條件的商品，試試其他關鍵字。</div>';
      document.querySelectorAll('.add').forEach(button => button.addEventListener('click', () => { bagCount++; document.getElementById('bagCount').textContent = bagCount; showNotice(`${button.dataset.name} 已加入購物袋`); }));
    }
    function showNotice(message) { const notice = document.getElementById('notice'); notice.textContent = message; notice.classList.add('show'); setTimeout(() => notice.classList.remove('show'), 2200); }
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('.filter').forEach(item => item.classList.remove('active')); button.classList.add('active'); activeFilter = button.dataset.filter; render(); }));
    document.getElementById('search').addEventListener('input', render);
    document.querySelectorAll('[data-nav]').forEach(link => link.addEventListener('click', () => { activeFilter = link.dataset.nav; document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item.dataset.filter === activeFilter)); render(); }));
    document.getElementById('bagButton').addEventListener('click', () => showNotice(bagCount ? `購物袋內有 ${bagCount} 件商品` : '購物袋目前是空的'));
    render();
  </script>
</body>
</html>
